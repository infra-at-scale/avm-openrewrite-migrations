name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up OSS Community Develocity Instance for Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Validate recipes before release
        run: ./gradlew rewriteDiscover

  release:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for release
        id: changelog
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          MAJOR=$(echo $CURRENT_TAG | sed 's/v\([0-9]*\)\.[0-9]*\.[0-9]*/\1/')
          MINOR=$(echo $CURRENT_TAG | sed 's/v[0-9]*\.\([0-9]*\)\.[0-9]*/\1/')
          PATCH=$(echo $CURRENT_TAG | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\)/\1/')
          
          # Extract section from CHANGELOG.md for this version
          awk "/## \[$MAJOR\.$MINOR\.$PATCH\]/,/## \[/ { if (!/## \[/ || /$MAJOR\.$MINOR\.$PATCH/) print }" CHANGELOG.md | head -n -1 > release_body.md
          
          # If extraction failed, use git log as fallback
          if [ ! -s release_body.md ]; then
            echo "Release $CURRENT_TAG" > release_body.md
            echo "" >> release_body.md
            PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" >> release_body.md
            else
              git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> release_body.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_body.md
